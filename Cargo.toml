[workspace]
members = ["app/w", "cr/k", "cr/db", "cr/os", "cr/fs", "cr/bg"]
default-members = ["app/w"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
byt-k = { path = "cr/k" }
byt-db = { path = "cr/db" }
byt-os = { path = "cr/os" }
byt-fs = { path = "cr/fs" }
byt-bg = { path = "cr/bg" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Etw", "Win32_System_Performance", "Win32_System_Registry", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_Time", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"